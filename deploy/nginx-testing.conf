# Include inside the existing gsse.work HTTPS server block only.
location = /testing {
    return 302 /testing/;
}
location ^~ /testing/ {
    if ($host != gsse.work) { return 302 https://gsse.work$request_uri; }
    proxy_pass http://127.0.0.1:5056;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 35s;
    client_max_body_size 16k;
    # OAuth authorization codes must not be logged in access query strings.
    access_log off;
}
